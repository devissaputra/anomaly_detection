<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Novelty Detection Pipeline</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Real digits → hold out digit 0 → train on normal classes only → score test examples</text>
<g font-family="Arial" font-size="20" text-anchor="middle">
<rect x="45" y="220" width="190" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="140" y="268" fill="#1e3a8a" font-weight="700">1. Load</text><text x="140" y="306" fill="#334155">sklearn digits</text><text x="140" y="336" fill="#334155">8×8 images</text>
<rect x="280" y="220" width="190" height="150" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="375" y="268" fill="#9a3412" font-weight="700">2. Define novelty</text><text x="375" y="306" fill="#334155">digit 0 = novel</text><text x="375" y="336" fill="#334155">others = normal</text>
<rect x="515" y="220" width="190" height="150" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="610" y="268" fill="#155e75" font-weight="700">3. Split</text><text x="610" y="306" fill="#334155">35% test</text><text x="610" y="336" fill="#334155">stratified</text>
<rect x="750" y="220" width="190" height="150" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="845" y="268" fill="#6b21a8" font-weight="700">4. Fit</text><text x="845" y="306" fill="#334155">Isolation Forest</text><text x="845" y="336" fill="#334155">normal train only</text>
<rect x="985" y="220" width="170" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="1070" y="268" fill="#166534" font-weight="700">5. Score</text><text x="1070" y="306" fill="#334155">ROC-AUC</text><text x="1070" y="336" fill="#334155">F1</text>
</g>
<g stroke="#2563eb" stroke-width="5"><path d="M235 295 H280"/><path d="M470 295 H515"/><path d="M705 295 H750"/><path d="M940 295 H985"/></g>
<rect x="190" y="455" width="820" height="110" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="496" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Isolation Forest configuration</text>
<text x="600" y="534" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">350 trees • contamination = 0.10 • random state = 42 • training excludes all digit-0 samples</text>
</svg>