<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f8fbff"/><text x="60" y="68" font-size="46" font-family="Arial" font-weight="700" fill="#12345b">Anomaly Detection</text><text x="62" y="108" font-size="23" font-family="Arial" fill="#5b6b82">Data Processing & Experimental Pipeline · from raw evidence to reproducible evaluation</text><rect x="45" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="76" cy="189" r="23" fill="#2f80d1"/><text x="76" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">1</text><text x="107" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Ingest &amp; label audit</text><text x="67" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Separate fit, tuning, and</text><text x="67" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">evaluation information.</text><line x1="285" y1="305" x2="299" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="299,305 287,297 287,313" fill="#5b6b82"/><rect x="299" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="330" cy="189" r="23" fill="#1e9e94"/><text x="330" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">2</text><text x="361" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Robust preprocessing</text><text x="321" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Scale features without</text><text x="321" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">allowing anomalies to</text><text x="321" y="317" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">dominate.</text><line x1="539" y1="305" x2="553" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="553,305 541,297 541,313" fill="#5b6b82"/><rect x="553" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="584" cy="189" r="23" fill="#f07a28"/><text x="584" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">3</text><text x="615" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Baseline scoring</text><text x="575" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Fit simple statistical and</text><text x="575" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">distance baselines.</text><line x1="793" y1="305" x2="807" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="807,305 795,297 795,313" fill="#5b6b82"/><rect x="807" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="838" cy="189" r="23" fill="#7354b5"/><text x="838" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">4</text><text x="869" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Model scoring</text><text x="829" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Train isolation / one-class</text><text x="829" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">/ representation models.</text><line x1="1047" y1="305" x2="1061" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="1061,305 1049,297 1049,313" fill="#5b6b82"/><rect x="1061" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="1092" cy="189" r="23" fill="#3f9458"/><text x="1092" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">5</text><text x="1123" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Threshold selection</text><text x="1083" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Use validation labels,</text><text x="1083" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">contamination assumptions,</text><text x="1083" y="317" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">or alert capacity.</text><line x1="1301" y1="305" x2="1315" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="1315,305 1303,297 1303,313" fill="#5b6b82"/><rect x="1315" y="155" width="240" height="310" rx="18" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><circle cx="1346" cy="189" r="23" fill="#cc4a4a"/><text x="1346" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="white">6</text><text x="1377" y="190" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#12345b">Evaluation</text><text x="1337" y="267" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">PR metrics, false alarms,</text><text x="1337" y="292" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">detection delay, and</text><text x="1337" y="317" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">robustness.</text><rect x="45" y="500" width="980" height="425" rx="22" fill="#ffffff" stroke="#bfd0e2" stroke-width="2"/><text x="75" y="545" font-size="30" font-family="Arial" font-weight="700" fill="#12345b">Modeling, inference & validation</text><text x="80" y="600" font-size="22" font-family="Georgia,serif" font-style="italic" fill="#12345b">s(x) = −log p̂(x)  or  reconstruction_error(x)</text><text x="80" y="650" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">Anomaly detection is sensitive to contamination and distribution</text><text x="80" y="679" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">shift. Report the assumed anomaly rate, threshold rule, and error</text><text x="80" y="708" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" fill="#5b6b82">burden rather than only visual examples.</text><line x1="95" y1="835" x2="470" y2="835" stroke="#5b6b82" stroke-width="2"/><line x1="95" y1="690" x2="95" y2="835" stroke="#5b6b82" stroke-width="2"/><polyline points="95,810 160,785 225,760 290,742 355,725 420,710 470,700" fill="none" stroke="#2f80d1" stroke-width="5"/><polyline points="95,800 160,770 225,740 290,712 355,690 420,672 470,660" fill="none" stroke="#f07a28" stroke-width="5"/><text x="95" y="870" font-size="15" font-family="Arial" fill="#5b6b82">conceptual evaluation trajectory (not measured values)</text><rect x="1050" y="500" width="505" height="425" rx="22" fill="#fff7ef" stroke="#bfd0e2" stroke-width="2"/><text x="1080" y="545" font-size="30" font-family="Arial" font-weight="700" fill="#12345b">Evaluation protocol</text><rect x="1080" y="600" width="440" height="68" rx="14" fill="#ffffff" stroke="#bfd0e2"/><circle cx="1110" cy="634" r="12" fill="#f07a28"/><text x="1134" y="628" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Detection</text><text x="1134" y="650" font-size="15" font-family="Arial" fill="#5b6b82">AUPRC / recall at alert budget</text><rect x="1080" y="682" width="440" height="68" rx="14" fill="#ffffff" stroke="#bfd0e2"/><circle cx="1110" cy="716" r="12" fill="#7354b5"/><text x="1134" y="710" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">False alarms</text><text x="1134" y="732" font-size="15" font-family="Arial" fill="#5b6b82">Precision and alerts per period</text><rect x="1080" y="764" width="440" height="68" rx="14" fill="#ffffff" stroke="#bfd0e2"/><circle cx="1110" cy="798" r="12" fill="#3f9458"/><text x="1134" y="792" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Delay</text><text x="1134" y="814" font-size="15" font-family="Arial" fill="#5b6b82">Detection latency for temporal events</text><rect x="1080" y="846" width="440" height="68" rx="14" fill="#ffffff" stroke="#bfd0e2"/><circle cx="1110" cy="880" r="12" fill="#cc4a4a"/><text x="1134" y="874" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Robustness</text><text x="1134" y="896" font-size="15" font-family="Arial" fill="#5b6b82">Contamination and shift sensitivity</text><text x="50" y="975" font-size="14" font-family="Arial" fill="#5b6b82">Scientific schematic · intended to document processing logic, controls, assumptions, and validation; empirical results belong in the repository outputs.</text></svg>