<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Evaluation Results</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Real test-set results from the included experiment.</text>
<rect x="70" y="180" width="320" height="360" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="110" y="230" font-family="Arial" font-size="23" font-weight="700" fill="#1e40af">Ranking quality</text>
<text x="110" y="330" font-family="Arial" font-size="66" font-weight="700" fill="#0f172a">0.8119</text>
<text x="110" y="370" font-family="Arial" font-size="24" fill="#475569">ROC-AUC</text>
<text x="110" y="445" font-family="Arial" font-size="20" fill="#64748b">Useful novelty ranking,</text><text x="110" y="473" font-family="Arial" font-size="20" fill="#64748b">but not perfect separation.</text>
<rect x="440" y="180" width="320" height="360" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="230" font-family="Arial" font-size="23" font-weight="700" fill="#9a3412">Thresholded detection</text>
<text x="480" y="330" font-family="Arial" font-size="66" font-weight="700" fill="#0f172a">0.2927</text>
<text x="480" y="370" font-family="Arial" font-size="24" fill="#475569">F1 score</text>
<text x="480" y="445" font-family="Arial" font-size="20" fill="#64748b">Default threshold leaves</text><text x="480" y="473" font-family="Arial" font-size="20" fill="#64748b">substantial classification error.</text>
<rect x="810" y="180" width="320" height="360" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="850" y="230" font-family="Arial" font-size="23" font-weight="700" fill="#166534">Test design</text>
<text x="850" y="320" font-family="Arial" font-size="58" font-weight="700" fill="#0f172a">629</text>
<text x="850" y="357" font-family="Arial" font-size="23" fill="#475569">test examples</text>
<text x="850" y="430" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Novel class: 0</text>
<text x="850" y="470" font-family="Arial" font-size="19" fill="#64748b">Novelty label fixed before scoring</text>
<rect x="230" y="585" width="740" height="55" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#9a3412">Strong ROC-AUC with weak F1 shows why anomaly-score ranking and threshold choice must be evaluated separately.</text>
</svg>