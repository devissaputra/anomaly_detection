name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "results/**"
      - "paper/**"
      - "DATA.md"
      - "RESEARCH_BUNDLE.md"
      - "REPRODUCIBILITY.md"
      - "CITATION.cff"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "results/**"
      - "paper/**"
      - "DATA.md"
      - "RESEARCH_BUNDLE.md"
      - "REPRODUCIBILITY.md"
      - "CITATION.cff"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run offline tests
        run: PYTHONPATH=. python -m pytest -q
